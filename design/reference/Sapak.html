<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ספק · Sapak — סוכן הרכש החכם</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Assistant:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&family=Noto+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================== TOKENS ============================== */
:root{
  --accent:#0E7C86;
  --accent-soft:color-mix(in srgb, var(--accent) 12%, transparent);
  --accent-ghost:color-mix(in srgb, var(--accent) 6%, transparent);
  --accent-strong:color-mix(in srgb, var(--accent) 82%, #000);
  --accent-ink:color-mix(in srgb, var(--accent) 78%, #0b2227);
  --on-accent:#fff;
  --ink:#0B2227; --ink-2:#46595c; --ink-3:#7a8a8c;
  --bg:#F3F8F8; --surface:#ffffff; --surface-2:#FAFCFC; --surface-3:#F0F6F6;
  --line:#E4EceC; --line-2:#D6E2E2;
  --good:#1E9E6A; --good-soft:rgba(30,158,106,.12);
  --amber:#C5811C; --amber-soft:rgba(197,129,28,.14);
  --blue:#2563EB; --blue-soft:rgba(37,99,235,.12);
  --gray-soft:#EEF3F3;
  --wave-1:color-mix(in srgb, var(--accent) 9%, #fff);
  --wave-2:color-mix(in srgb, var(--accent) 16%, #fff);
  --radius:14px; --radius-sm:10px; --radius-lg:22px;
  --shadow-sm:0 1px 2px rgba(11,34,39,.05), 0 1px 3px rgba(11,34,39,.04);
  --shadow:0 4px 14px rgba(11,34,39,.07), 0 2px 5px rgba(11,34,39,.05);
  --shadow-lg:0 18px 50px rgba(11,34,39,.13), 0 6px 18px rgba(11,34,39,.08);
  --shadow-accent:0 14px 34px color-mix(in srgb, var(--accent) 30%, transparent);
  --font-head:Heebo, system-ui, sans-serif;
  --font-body:Assistant, system-ui, sans-serif;
  --maxw:1180px;
}
.dark{
  --ink:#E8F1F1; --ink-2:#9fb2b3; --ink-3:#76898a;
  --bg:#091618; --surface:#0F2225; --surface-2:#12282B; --surface-3:#16302F;
  --line:#1d3a3d; --line-2:#244448;
  --wave-1:color-mix(in srgb, var(--accent) 16%, #0a1a1c);
  --wave-2:color-mix(in srgb, var(--accent) 26%, #0a1a1c);
  --gray-soft:#16302F;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 20px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;line-height:1.12;letter-spacing:-.01em;font-weight:800;color:var(--ink)}
p{margin:0}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
::selection{background:var(--accent-soft)}
.root{min-height:100vh;display:flex;flex-direction:column}

/* ============================== BUTTONS ============================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;
  border-radius:calc(var(--radius) - 2px);font-weight:700;font-size:15px;padding:10px 18px;
  transition:transform .12s ease, box-shadow .2s ease, background .2s ease, border-color .2s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-lg{padding:13px 26px;font-size:16px}
.btn-block{width:100%}
.btn svg{flex:none}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:var(--accent-strong);box-shadow:var(--shadow-accent)}
.btn-soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn-soft:hover{background:color-mix(in srgb, var(--accent) 20%, transparent)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn-light{background:#fff;color:var(--accent-ink)}
.btn-light:hover{box-shadow:var(--shadow-lg)}
.btn-outline-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.btn-outline-light:hover{background:rgba(255,255,255,.12)}
.btn .play{font-size:10px}

/* ============================== NAV ============================== */
.nav{position:sticky;top:0;z-index:100;transition:background .25s, box-shadow .25s, border-color .25s;
  border-bottom:1px solid transparent;background:color-mix(in srgb, var(--bg) 70%, transparent);
  backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px)}
.nav-scrolled{background:color-mix(in srgb, var(--surface) 86%, transparent);border-color:var(--line);box-shadow:var(--shadow-sm)}
.nav-inner{max-width:var(--maxw);margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:28px}
.nav-brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.nav-word{font-family:var(--font-head);font-weight:800;font-size:23px;color:var(--ink);letter-spacing:-.02em}
.nav-links{display:flex;gap:6px;margin-inline-start:8px}
.nav-link{background:none;border:0;font-weight:600;font-size:15px;color:var(--ink-2);padding:8px 14px;border-radius:10px;transition:.15s}
.nav-link:hover{background:var(--surface-3);color:var(--ink)}
.nav-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.lang-btn{background:var(--surface-3);border:1px solid var(--line);color:var(--ink-2);font-weight:700;font-size:13px;
  width:42px;height:38px;border-radius:10px;transition:.15s}
.lang-btn:hover{color:var(--accent);border-color:var(--accent)}

/* ============================== HERO ============================== */
.page{flex:1}
.hero{position:relative;overflow:hidden;padding:64px 24px 0}
.hero-glow{position:absolute;inset-inline-end:-10%;top:-30%;width:60%;height:120%;border-radius:50%;
  background:radial-gradient(circle, var(--accent-soft), transparent 62%);filter:blur(20px);pointer-events:none;z-index:0}
.hero-grid{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:1.05fr .95fr;
  gap:48px;align-items:center;padding-bottom:90px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent-ink);
  font-weight:700;font-size:13.5px;padding:7px 14px;border-radius:100px;margin-bottom:22px}
.eyebrow-spark{display:inline-flex;color:var(--accent)}
.eyebrow-center{margin:0 auto 18px}
.hero-title{font-size:clamp(34px,4.7vw,58px);font-weight:900;letter-spacing:-.025em;margin-bottom:22px}
.hero-line{display:block}
.hero-line:last-child{color:var(--accent)}
.hero-sub{font-size:clamp(16px,1.4vw,19px);color:var(--ink-2);max-width:30em;margin-bottom:30px;line-height:1.6}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-cta-center{justify-content:center}
.hero-note{margin-top:18px;color:var(--ink-3);font-size:14px;font-weight:600}

.hero-visual{position:relative;display:flex;justify-content:center}
.hero-waves{position:absolute;bottom:0;inset-inline:0;width:100%;height:90px;display:block;z-index:0}

/* phone / whatsapp */
.phone{position:relative;z-index:2;width:310px;background:var(--surface);border-radius:38px;padding:10px;
  box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.phone-notch{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:90px;height:7px;border-radius:10px;background:var(--line-2);z-index:3}
.wa-head{display:flex;align-items:center;gap:10px;padding:16px 14px 12px;border-radius:30px 30px 0 0;
  background:linear-gradient(var(--accent-strong),var(--accent));color:#fff}
.wa-avatar{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff}
.wa-meta{display:flex;flex-direction:column;line-height:1.2}
.wa-meta b{font-size:15px;font-family:var(--font-head)}
.wa-meta span{font-size:11.5px;opacity:.85}
.wa-dots{margin-inline-start:auto;display:flex;flex-direction:column;gap:3px}
.wa-dots span{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.7)}
.wa-body{background:var(--surface-3);padding:14px 12px;display:flex;flex-direction:column;gap:8px;min-height:300px}
.dark .wa-body{background:#0c1f21}
.wa-day{align-self:center;font-size:10.5px;color:var(--ink-3);background:var(--surface);padding:3px 10px;border-radius:8px;margin-bottom:2px}
.bub{max-width:82%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.45;position:relative;box-shadow:var(--shadow-sm)}
.bub-out{align-self:flex-end;background:color-mix(in srgb,var(--accent) 16%,#fff);color:var(--accent-ink);border-end-end-radius:4px}
.dark .bub-out{background:color-mix(in srgb,var(--accent) 30%,#0c1f21);color:#dff5f5}
.bub-in{align-self:flex-start;background:var(--surface);color:var(--ink);border-end-start-radius:4px}
.tick{margin-inline-start:6px;font-size:10px;color:var(--accent);font-style:normal}
.bub-card{padding:0;background:transparent;box-shadow:none;max-width:90%}
.offer-flash{display:flex;align-items:center;gap:8px;background:var(--good-soft);color:#137a50;border:1px solid rgba(30,158,106,.25);
  padding:10px 12px;border-radius:12px;font-weight:700;font-size:12.5px}
.dark .offer-flash{color:#5fd6a3}
.of-dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px var(--good-soft);flex:none}
.wa-input{display:flex;align-items:center;justify-content:space-between;background:var(--surface);margin:0;padding:12px 14px;
  border-radius:0 0 30px 30px;color:var(--ink-3);font-size:13px}
.wa-send{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff}

.float-card{position:absolute;z-index:3;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:11px 14px;box-shadow:var(--shadow-lg)}
.float-card b{font-family:var(--font-head);font-size:16px;display:block;line-height:1.1}
.float-card span{font-size:11.5px;color:var(--ink-3)}
.fc-ic{display:grid;place-items:center;width:34px;height:34px;border-radius:10px}
.fc-1{top:14%;inset-inline-start:-6%}
.fc-2{bottom:20%;inset-inline-end:-8%}

/* ============================== BANDS / SECTIONS ============================== */
.band{padding:78px 24px}
.band-top{padding-top:120px}
.band-tint{background:var(--surface-2)}
.dark .band-tint{background:#0c1f21}
.band-inner{max-width:var(--maxw);margin:0 auto}
.band-narrow{max-width:760px}
.sec-head{text-align:center;max-width:640px;margin:0 auto 52px}
.sec-head h2{font-size:clamp(26px,3vw,40px);font-weight:800;margin-bottom:14px}
.sec-head h2.big{font-size:clamp(30px,3.6vw,48px);font-weight:900;letter-spacing:-.02em}
.sec-head p{color:var(--ink-2);font-size:17px;line-height:1.55}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.step{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px}
.step-k{font-family:var(--font-head);font-weight:900;font-size:18px;color:var(--accent);background:var(--accent-soft);
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:18px}
.step h3{font-size:18px;margin-bottom:8px}
.step p{color:var(--ink-2);font-size:14.5px;line-height:1.55}
.step-line{position:absolute;top:48px;inset-inline-start:-7px;width:14px;height:2px;background:var(--line-2)}

/* feature cards */
.cards-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.feat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:30px 26px;transition:.2s}
.feat-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px);border-color:transparent}
.feat-ic{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent);margin-bottom:20px}
.feat-card h3{font-size:20px;margin-bottom:10px}
.feat-card p{color:var(--ink-2);line-height:1.6}

.aud-card{display:flex;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px}
.aud-ic{flex:none;display:grid;place-items:center;width:54px;height:54px;border-radius:14px;background:var(--accent-soft);color:var(--accent)}
.aud-card h3{font-size:19px;margin-bottom:8px}
.aud-card p{color:var(--ink-2);font-size:14.5px;line-height:1.55}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:44px 32px;box-shadow:var(--shadow)}
.metric{text-align:center;border-inline-start:1px solid var(--line)}
.metric:first-child{border:0}
.metric b{display:block;font-family:var(--font-head);font-weight:900;font-size:clamp(30px,3.4vw,42px);color:var(--accent);letter-spacing:-.02em}
.metric span{color:var(--ink-2);font-size:14.5px;font-weight:600}

/* final cta */
.final-cta{position:relative;overflow:hidden;text-align:center;border-radius:var(--radius-lg);padding:64px 32px;
  background:linear-gradient(135deg,var(--accent-strong),var(--accent));color:#fff;box-shadow:var(--shadow-lg)}
.fc-glow{position:absolute;inset:0;background:radial-gradient(circle at 80% 20%, rgba(255,255,255,.18), transparent 50%);pointer-events:none}
.final-cta h2{color:#fff;font-size:clamp(28px,3.2vw,42px);font-weight:900;margin-bottom:14px;position:relative}
.final-cta p{color:rgba(255,255,255,.9);font-size:18px;margin-bottom:30px;position:relative}
.final-cta .hero-cta{position:relative}

/* ============================== FOOTER ============================== */
.footer{background:var(--ink);color:#cfe0e1;padding:56px 24px 0;margin-top:auto}
.dark .footer{background:#060f10}
.footer-inner{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:1.4fr 2fr;gap:40px;padding-bottom:44px}
.footer .nav-word{color:#fff}
.footer-tag{color:#90a8a9;margin-top:14px;max-width:24em;line-height:1.6}
.footer-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.footer-col h4{color:#fff;font-size:14px;margin-bottom:14px;font-weight:700}
.footer-col button{display:block;background:none;border:0;color:#90a8a9;font-size:14.5px;padding:6px 0;text-align:start;transition:.15s}
.footer-col button:hover{color:#fff}
.footer-base{max-width:var(--maxw);margin:0 auto;border-top:1px solid rgba(255,255,255,.1);padding:22px 0;color:#7c9495;font-size:13.5px}

/* ============================== PRICING ============================== */
.bill-toggle{display:inline-flex;background:var(--surface-3);border:1px solid var(--line);border-radius:100px;padding:4px;margin-top:24px;gap:2px}
.bill-toggle button{background:none;border:0;border-radius:100px;padding:8px 20px;font-weight:700;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.bill-toggle .on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.save-pill{background:var(--good-soft);color:#137a50;font-size:11px;padding:2px 8px;border-radius:8px}
.dark .save-pill{color:#5fd6a3}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:32px 28px;position:relative}
.plan-feat{border:1.5px solid var(--accent);box-shadow:var(--shadow-lg);transform:scale(1.02)}
.plan-badge{position:absolute;top:-13px;inset-inline-start:28px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;padding:5px 14px;border-radius:100px}
.plan-name{font-size:21px;margin-bottom:6px}
.plan-desc{color:var(--ink-2);font-size:14.5px;margin-bottom:20px;min-height:21px}
.plan-price{display:flex;align-items:baseline;gap:6px;margin-bottom:22px}
.plan-price b{font-family:var(--font-head);font-weight:900;font-size:40px;letter-spacing:-.02em}
.plan-price span{color:var(--ink-3);font-size:15px;font-weight:600}
.plan-cta{width:100%;margin-bottom:24px}
.plan-feats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.plan-feats li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink-2)}
.plan-feats li i{color:var(--accent);flex:none;margin-top:2px}

.faq{display:flex;flex-direction:column;gap:10px}
.faq-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;background:none;border:0;
  padding:18px 22px;font-weight:700;font-size:16.5px;color:var(--ink);text-align:start}
.faq-chev{color:var(--ink-3);transition:transform .25s;display:inline-flex}
.faq-open .faq-chev{transform:rotate(180deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease}
.faq-open .faq-a{max-height:220px}
.faq-a p{padding:0 22px 20px;color:var(--ink-2);line-height:1.6}

/* how */
.how-steps{display:flex;flex-direction:column;gap:14px;max-width:840px;margin:0 auto}
.how-row{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px;transition:.2s}
.how-row:hover{box-shadow:var(--shadow);border-color:transparent}
.how-k{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;
  font-family:var(--font-head);font-weight:900;font-size:20px}
.how-body h3{font-size:20px;margin-bottom:6px}
.how-body p{color:var(--ink-2);line-height:1.55}
.how-art-ic{display:grid;place-items:center;width:54px;height:54px;border-radius:14px;background:var(--accent-soft);color:var(--accent)}
.how-cta{text-align:center;margin-top:36px}

/* ============================== AUTH ============================== */
.auth{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.auth-art{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--accent-strong),var(--accent));
  color:#fff;padding:48px;display:flex;flex-direction:column}
.auth-art-glow{position:absolute;top:-20%;inset-inline-end:-10%;width:60%;height:70%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.18),transparent 60%)}
.auth-brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;position:relative;z-index:2}
.auth-brand span{font-family:var(--font-head);font-weight:800;font-size:24px}
.auth-art-body{margin-top:auto;margin-bottom:auto;position:relative;z-index:2;max-width:24em}
.auth-art-body h2{color:#fff;font-size:clamp(26px,2.6vw,38px);font-weight:900;line-height:1.18;margin-bottom:14px}
.auth-art-body>p{color:rgba(255,255,255,.85);font-size:17px}
.auth-mini{margin-top:32px;display:flex;flex-direction:column;gap:14px}
.amini{display:flex;align-items:center;gap:12px;font-weight:600}
.amini i{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.16)}
.auth-waves{position:absolute;bottom:0;inset-inline:0;width:100%;height:120px}
.auth-form-wrap{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg)}
.auth-form{width:100%;max-width:400px}
.auth-form h1{font-size:30px;font-weight:900;margin-bottom:8px}
.auth-sub{color:var(--ink-2);margin-bottom:28px}
.btn-oauth{width:100%;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);margin-bottom:10px;font-weight:600}
.btn-oauth:hover{border-color:var(--accent);background:var(--surface-2)}
.btn-wa .wa-ic{color:#25D366;display:inline-flex}
.auth-or{display:flex;align-items:center;gap:14px;color:var(--ink-3);font-size:13px;margin:18px 0}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line)}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-weight:600;font-size:13.5px;color:var(--ink-2);margin-bottom:6px}
.fld input{width:100%;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--radius-sm);
  padding:12px 14px;font-size:15px;transition:.15s}
.fld input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px}
.link:hover{text-decoration:underline}
.btn-demo{background:var(--accent-soft);color:var(--accent-ink);margin-top:12px;border:1px dashed color-mix(in srgb,var(--accent) 40%,transparent)}
.btn-demo:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.sparkle-i,.eyebrow-spark{display:inline-flex}
.auth-foot{text-align:center;margin-top:22px;color:var(--ink-2);font-size:14.5px}

/* ============================== APP ============================== */
.app{display:flex;min-height:100vh;background:var(--bg)}
.rail{position:sticky;top:0;height:100vh;width:74px;flex:none;background:var(--surface);
  border-inline-end:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:8px;z-index:50}
.rail-brand{background:none;border:0;padding:0;margin-bottom:12px}
.rail-nav{display:flex;flex-direction:column;gap:6px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:6px}
.rail-btn{position:relative;width:46px;height:46px;border-radius:14px;border:0;background:transparent;color:var(--ink-3);
  display:grid;place-items:center;transition:.15s}
.rail-btn:hover{background:var(--surface-3);color:var(--ink)}
.rail-on{background:var(--accent-soft);color:var(--accent)}
.rail-on::before{content:"";position:absolute;inset-inline-start:-18px;top:50%;transform:translateY(-50%);width:3px;height:22px;border-radius:3px;background:var(--accent)}
.rail-lang{font-weight:800;font-size:13px;font-family:var(--font-head)}
.rail-tip{position:absolute;inset-inline-start:56px;top:50%;transform:translateY(-50%) scale(.96);transform-origin:inline-start;
  background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:.15s;z-index:60;box-shadow:var(--shadow)}
.rail-btn:hover .rail-tip{opacity:1;transform:translateY(-50%) scale(1)}
.rail-avatar{width:40px;height:40px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:800;font-family:var(--font-head);font-size:14px;margin-top:4px}

.app-main{flex:1;min-width:0;display:flex;flex-direction:column;max-height:100vh;overflow-y:auto}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:20px;padding:20px 32px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-titles h1{font-size:24px;font-weight:800}
.topbar-titles p{color:var(--ink-3);font-size:14px;margin-top:2px}
.topbar-tools{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;width:260px;color:var(--ink-3)}
.search input{border:0;background:none;outline:none;color:var(--ink);font-size:14.5px;width:100%}
.icon-btn{position:relative;width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;transition:.15s}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
.icon-btn .dot{position:absolute;top:9px;inset-inline-end:10px;width:7px;height:7px;border-radius:50%;background:var(--amber);border:1.5px solid var(--surface)}
.content{padding:28px 32px 60px}

/* suppliers */
.grid-suppliers{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:16px}
.sup-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;transition:.2s}
.sup-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:transparent}
.sup-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sup-av{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-family:var(--font-head);font-size:16px}
.sup-rate{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px;color:var(--ink-2)}
.sup-rate i{color:#E8B021;display:inline-flex}
.sup-name{font-size:17px;margin-bottom:4px}
.sup-cat{color:var(--accent-ink);background:var(--accent-soft);font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:8px;display:inline-block}
.sup-meta{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--ink-3);font-size:13.5px}
.sup-deals{font-weight:600;color:var(--ink-2)}

/* deals list */
.deals-list{display:flex;flex-direction:column;gap:12px}
.deal-row{display:grid;grid-template-columns:1.5fr 2fr auto;gap:24px;align-items:center;width:100%;text-align:start;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px;transition:.18s}
.deal-row:hover{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 30%,var(--line));transform:translateY(-1px)}
.dr-head{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.dr-ref{font-size:12.5px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
.dr-title{font-size:18px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-main{min-width:0}
.dr-sub{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-cat{color:var(--ink-2);font-weight:600}
.dr-dot{opacity:.5}
.dr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.dr-stat{display:flex;flex-direction:column;gap:2px}
.dr-stat b{font-family:var(--font-head);font-weight:800;font-size:18px;line-height:1}
.dr-stat span{font-size:11.5px;color:var(--ink-3)}
.save-pos{color:var(--good)!important}
.dr-go{display:flex;align-items:center;gap:14px}
.dr-days{display:flex;align-items:center;gap:5px;color:var(--ink-3);font-size:13px;font-weight:600;white-space:nowrap}
.dr-chev{color:var(--ink-3);display:inline-flex}
html[dir="rtl"] .dr-chev{transform:scaleX(-1)}
.deal-row:hover .dr-chev{color:var(--accent)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:100px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tone-teal{background:var(--accent-soft);color:var(--accent-ink)}
.tone-green{background:var(--good-soft);color:#137a50}
.dark .tone-green{color:#5fd6a3}
.tone-amber{background:var(--amber-soft);color:var(--amber)}
.tone-blue{background:var(--blue-soft);color:var(--blue)}
.tone-gray{background:var(--gray-soft);color:var(--ink-2)}

/* ============================== DEAL DETAIL ============================== */
.deal-detail{max-width:1080px}
.back-btn{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--ink-2);font-weight:600;font-size:14.5px;padding:6px 0;margin-bottom:18px}
.back-btn:hover{color:var(--accent)}
.deal-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px 30px;margin-bottom:22px;box-shadow:var(--shadow-sm)}
.dh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}
.dh-ref{font-size:13px;font-weight:700;color:var(--ink-3);margin-bottom:8px}
.dh-title{font-size:clamp(22px,2.4vw,30px);font-weight:900;letter-spacing:-.02em;margin-bottom:8px}
.dh-req{color:var(--ink-2);font-size:14.5px}
.hstats{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;padding-top:24px;border-top:1px solid var(--line)}
.hstat{display:flex;flex-direction:column;gap:5px}
.hstat-l{font-size:12.5px;color:var(--ink-3);font-weight:600}
.hstat-v{font-family:var(--font-head);font-weight:800;font-size:24px;line-height:1;letter-spacing:-.01em}
.hstat-sub{font-size:12px;color:var(--ink-3);font-weight:600}
.v-teal{color:var(--accent)}.v-good{color:var(--good)}

.tabs{display:flex;gap:4px;background:var(--surface-3);border-radius:12px;padding:4px;margin-bottom:22px;width:fit-content}
.tab{position:relative;background:none;border:0;border-radius:9px;padding:9px 18px;font-weight:700;font-size:14.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;transition:.15s}
.tab:hover{color:var(--ink)}
.tab-on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm)}
.tab-count{background:var(--accent-soft);color:var(--accent-ink);font-size:11.5px;padding:1px 7px;border-radius:8px}
.tab-on .tab-count{background:var(--accent);color:#fff}

/* offers / transactions */
.offers{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.offers-head{display:grid;grid-template-columns:2fr 1.2fr 1fr auto auto;gap:16px;padding:14px 22px;background:var(--surface-3);
  font-size:12.5px;font-weight:700;color:var(--ink-3)}
.offer-row{display:grid;grid-template-columns:2fr 1.2fr 1fr auto auto;gap:16px;align-items:center;padding:16px 22px;border-top:1px solid var(--line)}
.offer-win{background:var(--good-soft)}
.of-sup{display:flex;align-items:center;gap:12px}
.of-av{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-family:var(--font-head);font-size:14px;flex:none}
.of-sup b{font-size:15px;display:block}
.of-note{font-size:12.5px;color:var(--ink-3)}
.of-price{display:flex;align-items:baseline;gap:8px}
.of-price b{font-family:var(--font-head);font-weight:800;font-size:17px}
.of-delta{font-size:12.5px;font-weight:700}
.of-delta.good{color:var(--good)}.of-delta.bad{color:#c0492f}
.of-del{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:14px}
.of-del i{color:var(--ink-3)}
.of-act{display:flex;justify-content:flex-end;min-width:108px}
.btn-pick{background:var(--surface);border:1px solid var(--line-2);color:var(--ink);font-size:13.5px;padding:8px 14px;border-radius:9px;font-weight:700}
.btn-pick:hover{border-color:var(--accent);color:var(--accent)}
.win-tag{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-weight:800;font-size:13.5px}
.win-tag i{display:inline-flex;background:var(--good);color:#fff;border-radius:50%;padding:2px}

/* inbox */
.inbox{display:grid;grid-template-columns:330px 1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-height:560px}
.inbox-list{border-inline-end:1px solid var(--line);overflow-y:auto;max-height:620px}
.ibx-item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 18px;transition:.12s}
.ibx-item:hover{background:var(--surface-3)}
.ibx-on{background:var(--accent-ghost)}
.ibx-on::before{content:"";position:absolute}
.ibx-av{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-family:var(--font-head);font-size:13px;flex:none}
.ibx-av.lg{width:46px;height:46px;font-size:15px}
.ibx-meta{flex:1;min-width:0}
.ibx-row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ibx-row1 b{font-size:14.5px}
.ibx-row1 span{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.ibx-row2{font-size:13px;font-weight:600;color:var(--ink-2);margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibx-row3{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibx-tag{align-self:center;flex:none}
.inbox-thread{display:flex;flex-direction:column;min-width:0}
.thr-head{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line)}
.thr-head b{font-size:16px;display:block}
.thr-head span{font-size:13px;color:var(--ink-3)}
.thr-body{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px;max-height:430px;background:var(--surface-2)}
.dark .thr-body{background:#0c1f21}
.email{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm)}
.email-out{border-inline-start:3px solid var(--accent)}
.email-in{border-inline-start:3px solid var(--line-2)}
.email-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.email-av{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.av-sapak{background:var(--accent-soft);color:var(--accent)}
.av-sup{background:var(--surface-3);color:var(--ink-2)}
.email-from{flex:1;min-width:0}
.email-from b{font-size:14px;display:block}
.email-subj{font-size:12.5px;color:var(--ink-3)}
.email-time{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.email-body p{font-size:14px;color:var(--ink);line-height:1.6;margin-bottom:2px}
.email-body p:empty{height:8px}
.composer{display:flex;gap:10px;align-items:flex-end;padding:14px 18px;border-top:1px solid var(--line);background:var(--surface)}
.composer textarea{flex:1;border:1px solid var(--line-2);border-radius:11px;padding:11px 14px;font-size:14px;resize:none;color:var(--ink);background:var(--surface-2);outline:none;line-height:1.5}
.composer textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer-send{flex:none}

/* overview */
.overview{display:grid;grid-template-columns:1fr 320px;gap:18px}
.ov-main{display:flex;flex-direction:column;gap:18px;min-width:0}
.ov-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.ov-h{font-size:16px;margin-bottom:18px}
.spec-list{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:11px}
.spec-list li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink)}
.spec-list li i{color:var(--accent);flex:none;margin-top:2px}
.spec-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-top:18px;border-top:1px solid var(--line)}
.spec-meta span{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
.spec-meta b{font-family:var(--font-head);font-size:16px}
.bars{display:flex;flex-direction:column;gap:14px;position:relative}
.bar-row{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center}
.bar-name{font-size:13px;color:var(--ink-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:22px;background:var(--surface-3);border-radius:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:7px;transition:width .5s ease;min-width:6px}
.bar-val{font-family:var(--font-head);font-weight:700;font-size:13.5px;white-space:nowrap}
.bar-target{position:absolute;top:-4px;bottom:-4px;width:2px;background:repeating-linear-gradient(var(--ink-3) 0 4px,transparent 4px 8px);z-index:2}
.bar-target span{position:absolute;top:-18px;inset-inline-start:50%;transform:translateX(50%);font-size:10.5px;color:var(--ink-3);font-weight:700;white-space:nowrap}
.ov-time .timeline{display:flex;flex-direction:column;gap:18px}
.tl-item{display:flex;gap:12px;align-items:flex-start;position:relative}
.tl-ic{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.tl-txt{font-size:13.5px;color:var(--ink);font-weight:600;padding-top:4px}
.tl-time{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500;margin-top:2px}

.empty{text-align:center;color:var(--ink-3);padding:60px 24px;font-size:15px;background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--radius)}

/* ============================== RESPONSIVE ============================== */
@media(max-width:980px){
  .hero-grid{grid-template-columns:1fr;text-align:center;gap:30px}
  .hero-copy{display:flex;flex-direction:column;align-items:center}
  .hero-cta{justify-content:center}
  .steps,.cards-3,.metrics,.plans{grid-template-columns:1fr 1fr}
  .footer-inner{grid-template-columns:1fr}
  .auth{grid-template-columns:1fr}
  .auth-art{display:none}
  .overview{grid-template-columns:1fr}
  .dr-stats{grid-column:1 / -1;grid-template-columns:repeat(4,auto);justify-content:start;gap:26px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .deal-row{grid-template-columns:1fr auto;row-gap:0}
  .dr-go{grid-row:1;align-self:start}
  .inbox{grid-template-columns:1fr}
  .inbox-list{max-height:240px}
}
@media(max-width:640px){
  .nav-links{display:none}
  .steps,.cards-3,.metrics,.plans{grid-template-columns:1fr}
  .hstats{grid-template-columns:1fr 1fr 1fr}
  .metric{border:0}
  .band{padding:54px 20px}
  .content{padding:20px}
  .offers-head{display:none}
  .offer-row{grid-template-columns:1fr 1fr;gap:10px}
  .of-act{grid-column:span 2}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel" src="src/home.jsx"></script>
<script type="text/babel" src="src/pricing.jsx"></script>
<script type="text/babel" src="src/auth.jsx"></script>
